<!doctype html>
<html lang="en">
  <head>
    <!-- Google Search Console site verification -->
    <meta name="google-site-verification" content="hvHbMPrjA6p6JHTrzQmYhhjeMEUmaGpi41koaJNtd00" />
    <meta charset="UTF-8" />
    <!-- Existing favicon (SVG — used as base icon) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- SEO: viewport for mobile responsiveness (required for mobile-first indexing) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── PWA META TAGS ──────────────────────────────────────────────── -->
    <!-- Basic PWA -->
    <meta name="application-name" content="COMSTAS Cafe" />
    <meta name="theme-color" content="#ffb59d" />

    <!-- iOS PWA — allows "Add to Home Screen" to open as standalone app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="COMSTAS Cafe" />

    <!-- Android PWA -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Microsoft / Edge PWA -->
    <meta name="msapplication-TileColor" content="#ffb59d" />
    <meta name="msapplication-tap-highlight" content="no" />
    <!-- ── END PWA META TAGS ──────────────────────────────────────────── -->

    <!-- SEO: Default meta — overridden per route by react-helmet-async (PageSEO.jsx) -->
    <title>COMSTAS Cafe — Campus Cafeteria Management System</title>
    <meta name="description" content="Order fresh campus meals online, track orders in real time, and manage cafeteria menus with COMSTAS Cafe — the modern cafeteria management platform for students and staff." />
    <meta name="keywords" content="cafeteria management, campus dining, online food ordering, COMSTAS Cafe, university cafeteria, menu ordering, order tracking" />
    <meta name="author" content="COMSTAS Cafe Engineering Team" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://comsats-cafeteria.vercel.app/" />
    <!-- Open Graph (social sharing + crawlers) -->
    <meta property="og:site_name" content="COMSTAS Cafe" />
    <meta property="og:title" content="COMSTAS Cafe — Campus Cafeteria Management System" />
    <meta property="og:description" content="Order fresh campus meals online, track orders in real time, and manage cafeteria menus with COMSTAS Cafe." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://comsats-cafeteria.vercel.app/" />
    <meta property="og:image" content="https://comsats-cafeteria.vercel.app/favicon.svg" />
    <meta property="og:locale" content="en_US" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="COMSTAS Cafe — Campus Cafeteria Management System" />
    <meta name="twitter:description" content="Order fresh campus meals online, track orders in real time, and manage cafeteria menus." />
    <meta name="twitter:image" content="https://comsats-cafeteria.vercel.app/favicon.svg" />
    <!-- Performance: early connections for fonts + Supabase assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://nvfjbaunuzkarcizqhfu.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://nvfjbaunuzkarcizqhfu.supabase.co" />
    <!-- Critical text fonts (LCP hero uses Manrope) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600&display=swap"
    />
    <!-- Login-page fonts — non-blocking -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <!-- Material Symbols (~4MB) — load after first paint -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap"
      />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
