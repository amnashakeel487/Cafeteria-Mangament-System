<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb59d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#cc4a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b2e00;stop-opacity:1" />
    </linearGradient>
    <clipPath id="diamondClip">
      <polygon points="256,52 460,256 256,460 52,256"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#121222"/>

  <!-- Shadow diamond (offset) -->
  <polygon points="276,72 480,276 276,480 72,276" fill="url(#shadowGrad)" opacity="0.85"/>

  <!-- Main diamond -->
  <polygon points="256,52 460,256 256,460 52,256" fill="url(#diamondGrad)"/>

  <!-- SPOON (left) — clipped inside diamond -->
  <g clip-path="url(#diamondClip)">
    <!-- Spoon bowl (large rounded ellipse) -->
    <ellipse cx="196" cy="200" rx="42" ry="54" fill="white"/>
    <!-- Spoon bowl shine -->
    <ellipse cx="183" cy="184" rx="10" ry="16" fill="#FF6B35" opacity="0.5"/>
    <!-- Spoon neck (narrows from bowl to handle) -->
    <path d="M178,250 Q196,270 196,290 L196,380 Q196,388 188,388 L204,388 Q196,388 196,380 Z" fill="white"/>
    <!-- Spoon handle (straight, rounded ends) -->
    <rect x="186" y="248" width="20" height="142" rx="10" fill="white"/>
  </g>

  <!-- FORK (right) — clipped inside diamond -->
  <g clip-path="url(#diamondClip)">
    <!-- Fork tines (4 tines) -->
    <rect x="285" y="130" width="9" height="90" rx="4" fill="white"/>
    <rect x="300" y="130" width="9" height="90" rx="4" fill="white"/>
    <rect x="315" y="130" width="9" height="90" rx="4" fill="white"/>
    <rect x="330" y="130" width="9" height="90" rx="4" fill="white"/>
    <!-- Fork crossbar -->
    <rect x="285" y="215" width="54" height="10" rx="3" fill="white"/>
    <!-- Fork handle -->
    <rect x="299" y="224" width="20" height="156" rx="10" fill="white"/>
  </g>
</svg>
